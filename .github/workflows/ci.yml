name: ci
on:
  pull_request: {}
  push: {branches: [main]}

jobs:
  backend:
    runs-on: ubuntu-latest  # Docker is available: tests use real PostgreSQL + Redis via testcontainers
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
        env: {NEXT_PUBLIC_API_URL: http://localhost:8000}

  api-types-in-sync:  # fails if someone changed the API but not frontend/lib/schema.d.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: {package_json_file: frontend/package.json}
      - run: cd backend && uv sync --frozen && PYTHONPATH=. uv run python scripts/dump_openapi.py ../frontend/openapi.json
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm exec openapi-typescript openapi.json -o lib/schema.d.ts
      - run: git diff --exit-code frontend/openapi.json frontend/lib/schema.d.ts

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, api-types-in-sync]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: backend, push: true, tags: "ghcr.io/${{ github.repository }}/api:${{ github.sha }}"}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: "ghcr.io/${{ github.repository }}/web:${{ github.sha }}"
          build-args: NEXT_PUBLIC_API_URL=https://${{ vars.SUBDOMAIN }}.${{ vars.BASE_DOMAIN }}/api

  check-deploy-secrets:  # `secrets` cannot be used in `if:` directly, so expose presence as an output
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs: {enabled: "${{ steps.c.outputs.enabled }}"}
    steps:
      - id: c
        env: {H: "${{ secrets.DEPLOY_HOST }}", K: "${{ secrets.DEPLOY_SSH_KEY }}"}
        run: '[ -n "$H" ] && [ -n "$K" ] && echo enabled=true >> "$GITHUB_OUTPUT" || echo enabled=false >> "$GITHUB_OUTPUT"'

  deploy:
    needs: [images, check-deploy-secrets]
    if: needs.check-deploy-secrets.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy credentials
        run: |
          install -m 600 /dev/null key && printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > key
          cat > .env.deploy <<EOF2
          DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER=${{ secrets.DEPLOY_USER }}
          SSH_KEY_PATH=$PWD/key
          BASE_DOMAIN=${{ vars.BASE_DOMAIN }}
          SUBDOMAIN=${{ vars.SUBDOMAIN }}
          EOF2
      - run: scripts/deploy.sh
