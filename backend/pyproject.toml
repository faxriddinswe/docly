[project]
name = "docly-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis",
  "arq",
  "aiogram",
  "argon2-cffi",
  "pyjwt",
  "email-validator",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "testcontainers[postgres,redis]", "asgi-lifespan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*"]
strict = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N802"]
"alembic/*" = ["E501"]
"app/seed.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["app.api.deps.require_roles", "fastapi.Depends", "fastapi.Query", "fastapi.Security"]
