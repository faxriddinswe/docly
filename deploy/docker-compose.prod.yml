# Production stack for a SHARED VPS. No host ports are published: all traffic enters via the edge Caddy
# over the external docker network "edge". Names/aliases are prefixed (docly-*) so they cannot clash with other projects.
name: ${COMPOSE_PROJECT_NAME:-docly}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-app-env: &app-env
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://docly_app:${APP_DB_PASSWORD}@postgres:5432/docly
  MIGRATION_DATABASE_URL: postgresql+asyncpg://docly:${POSTGRES_PASSWORD}@postgres:5432/docly
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  OTP_SENDER: ${OTP_SENDER:-eskiz}
  ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
  ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  CORS_ORIGINS: https://${DOCLY_HOST}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: docly, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: docly}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=40", "-c", "effective_cache_size=192MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 384m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docly -d docly"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  migrate:
    image: docly-api:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on: {postgres: {condition: service_healthy}}
    networks: [internal]
    mem_limit: 256m
    logging: *logging

  api:
    image: docly-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks:
      internal: {}
      edge: {aliases: [docly-api]}
    mem_limit: 384m
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: docly-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [internal]
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    image: docly-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: [telegram]  # enabled by deploy.sh only when TELEGRAM_BOT_TOKEN is set
    command: ["python", "-m", "app.bot.main"]
    environment: *app-env
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [internal]
    mem_limit: 128m
    logging: *logging

  frontend:
    image: docly-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      edge: {aliases: [docly-web]}
    mem_limit: 192m
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh", "loop"]
    environment:
      PGHOST: postgres
      PGUSER: docly
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: docly
      KEEP: "7"
      BACKUP_HOUR: "02"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on: {postgres: {condition: service_healthy}}
    networks: [internal]
    mem_limit: 64m
    logging: *logging

networks:
  internal: {}
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  pgdata: {}
  redisdata: {}
  backups: {}
